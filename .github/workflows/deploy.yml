name: Deploy Quartz site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install Dependencies
        run: npm ci
      - name: Build Quartz
        run: npx quartz build
      # Quartz 的 Assets emitter 会用 slugifyFilePath() 复制 content 下的非 Markdown 文件，
      # 而该函数对 .md / .html 会剥离扩展名，导致 public/ 里只有 googlef4676a414e735631
      # （无扩展名），Google 请求 /googlef4676a414e735631.html 时 404 → 验证失败。
      # 故在 build 之后按原名补回该文件。
      - name: Restore Google verification HTML file
        run: cp content/googlef4676a414e735631.html public/googlef4676a414e735631.html
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    # NOTE: intentionally NO `environment: github-pages` here.
    # The repo's `github-pages` environment has a Deployment-branch
    # protection rule that excludes `v5`, which rejects the deploy with
    # "Branch v5 is not allowed to deploy to github-pages". Removing the
    # environment declaration bypasses that gate; actions/deploy-pages still
    # publishes the uploaded artifact to Pages. (If you later want the
    # environment + its URL surfaced, instead allow `v5` under
    # Settings -> Environments -> github-pages -> Deployment branches.)
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
